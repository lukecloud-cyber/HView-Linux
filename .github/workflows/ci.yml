name: Linux checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Linux x86-64 checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
      - name: Install Linux test tools
        run: sudo apt-get update && sudo apt-get install --yes acl binutils
      - name: Install the Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Select the Rust toolchain
        run: rustup default 1.98.0
      - name: Check the format
        run: cargo fmt --all -- --check
      - name: Run the Rust tests
        run: cargo test --locked --all-targets -- --test-threads=1
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build the release executable
        run: cargo build --locked --release
      - name: Check the native engines
        run: target/release/hview-linux --self-test
      - name: Run the terminal probes
        shell: bash
        run: |
          for probe in tests/*_probe.py; do
            if [[ "$probe" != "tests/package_probe.py" ]]; then
              python3 "$probe" target/release/hview-linux
            fi
          done
      - name: Build and check the isolated package
        run: python3 scripts/package.py "$RUNNER_TEMP/hview-linux-package"
